name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify release version
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /tmp/cargo-metadata.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/cargo-metadata.json", encoding="utf-8") as file:
              metadata = json.load(file)
          package = next(p for p in metadata["packages"] if p["name"] == "tcloc")
          expected = f"v{package['version']}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              raise SystemExit(f"tag {tag} does not match package version {expected}")
          PY
          test -z "$(git status --porcelain)"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify packaging
        run: cargo publish --locked --dry-run

      - name: Check whether version is already published
        id: registry
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open("/tmp/cargo-metadata.json", encoding="utf-8") as file:
              metadata = json.load(file)
          package = next(p for p in metadata["packages"] if p["name"] == "tcloc")
          version = package["version"]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/tcloc/{version}",
              headers={"User-Agent": "tcloc-release (https://github.com/leonardcser/tcloc)"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  published = json.load(response)["version"]["num"] == version
                  if not published:
                      raise SystemExit("unexpected version returned by crates.io")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"published={str(published).lower()}\n")
          if published:
              print(f"tcloc {version} is already published; skipping upload")
          PY

      - name: Authenticate to crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
