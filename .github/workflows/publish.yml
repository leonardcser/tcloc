name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify release version
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /tmp/cargo-metadata.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/cargo-metadata.json", encoding="utf-8") as file:
              metadata = json.load(file)
          package = next(p for p in metadata["packages"] if p["name"] == "tcloc")
          expected = f"v{package['version']}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              raise SystemExit(f"tag {tag} does not match package version {expected}")
          PY
          test -z "$(git status --porcelain)"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify packaging
        run: cargo publish --locked --dry-run

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
